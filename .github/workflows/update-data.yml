name: Update data.json from Google Trends

# Spúšťa sa:
# 1. každý pondelok o 06:00 UTC (cca 08:00 SK letný čas)
# 2. manuálne cez Actions tab → "Run workflow"
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh Trends data
        # Skript končí 1 ak Trends blokuje (429) alebo dáta sú prázdne —
        # vtedy chceme tichý preskok bez red ❌ v Actions.
        continue-on-error: true
        run: python update_data.py

      - name: Commit & push if data.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain data.json)" ]]; then
            echo "= data.json unchanged — Trends nevrátil nové dáta (alebo 429)"
            exit 0
          fi
          git add data.json
          git commit -m "chore(data): auto-update Google Trends SK [skip ci]"
          # Retry s rebase pre prípad race conditions s ľudskými commitmi
          for i in 1 2 3; do
            if git pull --rebase origin master && git push; then
              echo "✓ data.json updated (attempt $i)"
              exit 0
            fi
            echo "  push rejected, retry $i…"
            sleep 3
          done
          echo "::error::push failed after 3 retries"
          exit 1
