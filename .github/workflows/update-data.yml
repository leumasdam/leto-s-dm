name: Update data.json from Google Trends

# Spúšťa sa:
# 1. každý pondelok o 06:00 UTC (cca 08:00 SK letný čas)
# 2. manuálne cez Actions tab → "Run workflow"
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh Trends data
        # Skript končí 1 ak Trends blokuje (429) alebo dáta sú prázdne —
        # vtedy chceme tichý preskok bez red ❌ v Actions.
        continue-on-error: true
        run: python update_data.py

      - name: Fetch Pinterest Trends (AT proxy)
        # Beží len keď je secret nastavený. Bez tokenu skript exit 0 (tichý skip).
        continue-on-error: true
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: python update_pinterest.py

      - name: Generate weekly report (report.json)
        # AI summary cez Claude API ak je ANTHROPIC_API_KEY secret nastavený.
        # Inak template-based fallback — script vždy zapíše report.json.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      - name: Commit & push if data/report changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain data.json report.json)" ]]; then
            echo "= data.json & report.json unchanged — žiadny update"
            exit 0
          fi
          git add data.json report.json
          git commit -m "chore(data): auto-update Trends + weekly report [skip ci]"
          # Retry s rebase pre prípad race conditions s ľudskými commitmi
          for i in 1 2 3; do
            if git pull --rebase origin master && git push; then
              echo "✓ data.json updated (attempt $i)"
              exit 0
            fi
            echo "  push rejected, retry $i…"
            sleep 3
          done
          echo "::error::push failed after 3 retries"
          exit 1
